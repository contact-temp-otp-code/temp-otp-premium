<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - ViOTP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <i class="fas fa-mobile-alt"></i>
          <span>ViOTP</span>
        </a>
        <h2>Tạo tài khoản</h2>
        <p>Bắt đầu hành trình với ViOTP! 🚀</p>
      </div>
      <form id="registerForm">
        <div class="form-group">
          <label><i class="fas fa-user"></i> Họ và tên</label>
          <input type="text" id="name" placeholder="Nguyễn Văn A" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="email" placeholder="example@gmail.com" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Mật khẩu</label>
          <input type="password" id="password" placeholder="•••••••• (tối thiểu 6 ký tự)" required minlength="6">
        </div>
        <div class="form-group">
          <label><i class="fas fa-check-circle"></i> Xác nhận mật khẩu</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" required>
        </div>
        <div class="form-terms">
          <label class="checkbox">
            <input type="checkbox" required> Tôi đồng ý với <a href="#">Điều khoản dịch vụ</a> và <a href="#">Chính sách bảo mật</a>
          </label>
        </div>
        <button type="submit" class="btn-auth">Đăng ký</button>
        <div id="message" class="alert" style="display: none;"></div>
      </form>
      <div class="auth-footer">
        <p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
